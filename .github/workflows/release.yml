name: release

# Push a tag like v1.1.0 to publish a GitHub Release with personawriter.zip attached,
# ready to upload in claude.ai / Claude Desktop (Settings -> Capabilities -> Skills).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover tests
      - name: Check tag matches plugin version
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version"
            exit 1
          fi
      - name: Build skill zip
        run: |
          cd skills
          zip -r ../personawriter.zip personawriter -x '*/__pycache__/*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" personawriter.zip --title "PersonaWriter $GITHUB_REF_NAME" --generate-notes

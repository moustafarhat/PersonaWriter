# Labels pull requests by the paths they touch (rules in .github/labeler.yml).
# Runs as pull_request_target so it works on PRs from forks; it never checks out PR code.
name: Labeler
on: [pull_request_target]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
